name: Desktop builds

# Builds the Particly desktop app on Windows, macOS and Linux, smoke-tests each
# packaged app, and uploads the installers. Pushing a tag like v1.0.0 also
# attaches them to a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'desktop/**'
      - 'tools/smoke-test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned builds

      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: |
          npm install --no-save playwright-core@1.56.1
          node tools/smoke-test.cjs

      - name: Smoke test packaged app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright-core@1.56.1
          xvfb-run -a node tools/smoke-test.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: Particly-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/smoke-*.png
          if-no-files-found: error

  # Publishes a GitHub Release (and creates its tag) once all three builds pass.
  # Runs for a pushed v* tag, or for a commit whose message contains "[release]"
  # (tag = "v" + package.json version).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Particly ${{ steps.version.outputs.tag }}
          body: |
            Particly — Roblox particle effect studio.

            **Downloads**
            - **Windows:** `Particly-Setup-*.exe` (installer) or `Particly-Portable-*.exe` (no install). On the SmartScreen warning click *More info → Run anyway*.
            - **macOS:** `Particly-*-arm64.dmg` (Apple Silicon) or `Particly-*-x64.dmg` (Intel). First launch: right-click the app → *Open*.
            - **Linux:** `Particly-*.AppImage` (`chmod +x`, then run).

            No install needed either: `dist/Particly.html` in the repository runs in any browser.
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
          fail_on_unmatched_files: true
